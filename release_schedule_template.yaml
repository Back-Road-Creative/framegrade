# Metricool Release Schedule Template
# Copy this to your project directory as release_schedule.yaml and fill in your times.
#
# Example:
#   cp release_schedule_template.yaml /path/to/output/YOURPROJECT/release_schedule.yaml
#   Edit the file with your actual schedule
#
# The pipeline will STOP if this file doesn't exist in the project directory.

project_name: "CHANGE_ME"
location: "Location Name, Country"
filmed_date: "YYYY-MM-DD"

# Schedule: list of shorts with their release datetime
# Format: YYYY-MM-DD HH:MM:SS (24-hour, local timezone)
shorts:
  - index: 1
    datetime: "2030-01-04 12:00:00"
    hook: "Your hook text here"
    weather: "normal"  # normal, rainy, overcast, sunny

  - index: 2
    datetime: "2030-01-04 16:00:00"
    hook: "Your hook text here"
    weather: "normal"

  - index: 3
    datetime: "2030-01-05 08:00:00"
    hook: "Your hook text here"
    weather: "normal"

# Add more shorts as needed...

# Platform settings (optional overrides)
platforms:
  facebook: true
  twitter: true
  instagram: true
  pinterest: true
  tiktok: true
  youtube: true
  threads: true
  linkedin: false
  gbp: false

# Pinterest board name
pinterest_board: "Travel Videos"
