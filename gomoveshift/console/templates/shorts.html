{% extends "_base.html" %}
{% block title %}Shorts - GoMoveShift Console{% endblock %}
{% block content %}
  <h1>Shorts</h1>
  {% set form = form or {} %}
  {% if error %}<p class="job-failed" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/shorts/run">
    <label>Brand
      <select name="brand">
        {% for b in brands %}
        <option value="{{ b }}" {% if b == (form.brand or brand) %}selected{% endif %}>{{ b }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Source directory <input type="text" name="directory" value="{{ form.directory or '' }}" required></label>
    <label>Output directory <input type="text" name="output_dir" value="{{ form.output_dir or '' }}" required></label>
    <label>Region
      <select name="region">
        <option value="">(preserve saved region)</option>
        <option value="ireland" {% if form.region == "ireland" %}selected{% endif %}>ireland</option>
        <option value="usa" {% if form.region == "usa" %}selected{% endif %}>usa</option>
      </select>
    </label>
    <label><input type="checkbox" name="dry_run" {% if form and form.dry_run or not form %}checked{% endif %}> Dry run</label>
    <label><input type="checkbox" name="confirm_plan" {% if form.confirm_plan %}checked{% endif %}> I reviewed the dry-run plan; proceed with a full render</label>
    <label><input type="checkbox" name="skip_upload" {% if form.skip_upload %}checked{% endif %}> Render without uploading to Drive or YouTube</label>
    <label><input type="checkbox" name="ost_system_review" {% if form.ost_system_review %}checked{% endif %}> Use GPS to review on-screen locations (stops if unverified)</label>
    <label>Publish day
      <select name="publish">
        <option value="">(none)</option>
        {% for day in weekdays %}
        <option value="{{ day }}" {% if form.publish == day %}selected{% endif %}>{{ day }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Long-form day <small>(--lf-day, the calendar day of footage to assemble)</small>
      <select name="lf_day">
        <option value="">(none)</option>
        {% for day in weekdays %}
        <option value="{{ day }}" {% if form.lf_day == day %}selected{% endif %}>{{ day }}</option>
        {% endfor %}
      </select>
    </label>
    <fieldset>
      <legend>Pipeline flags</legend>
      <label>Shorts per long-form (--shorts-target) <input type="number" name="shorts_target" value="{{ form.shorts_target or '' }}"></label>
      <label>Minimum seconds between shorts (--shorts-gap) <input type="number" step="any" name="shorts_gap" value="{{ form.shorts_gap or '' }}"></label>
    </fieldset>
    <button type="submit">Launch</button>
  </form>
  <h2>Shorts CSV preview</h2>
  <form method="get" action="/shorts/csv">
    <label>Output folder of the run <input type="text" name="output_dir" required></label>
    <button type="submit">Preview CSV</button>
  </form>
  <p><a href="/">Back</a></p>
{% endblock %}
