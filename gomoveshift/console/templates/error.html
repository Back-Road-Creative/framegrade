{% extends "_base.html" %}
{% block title %}Error {{ status_code }} - GoMoveShift Console{% endblock %}
{% block content %}
  <h1>GoMoveShift Console</h1>
  <ul>
    {% for slug, title in nav_entries %}
    <li><a href="/{{ slug }}">{{ title }}</a></li>
    {% endfor %}
  </ul>
  <h2>Error {{ status_code }}</h2>
  <p>{{ message }}</p>
  <p><a href="/">Back</a></p>
{% endblock %}
