# Example seed profile for the public tree. The pipeline reads this file at import
# time as its starting publish cadence and media defaults; replace it with your own
# brand's profile.

# The engine's defaults, stated explicitly (publishing/brand_policy.py MediaProfile).
media:
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  brand_text: GoMoveShift
  website_text: gomoveshift.com
  still_card_style: letterbox
  upscale: "off"
  claim_native_resolution_only: true

# Each region's shorts_times is every hour its shorts post at; each long-form
# day's drive takes its share (the last long-form day takes the earliest hours).
seo:
  cadence:
    timezone: America/New_York
    # How far ahead a finished drive may claim its slot. ``health backlog`` renders for any
    # free slot this far out (``launch.render_horizon_h``), so 70 days lets the backlog render
    # and schedule drive after drive instead of one a week (JP 2026-11-14: "we should be
    # pumping through these to get them rendered and published/scheduled asap").
    lead_hours: 1680
    superlong_day: sat
    regions:
      ireland:
        dow: [sun]
        time: "14:00"
        shorts_times: ["08:00", "12:00"]
      usa:
        dow: [tue, fri]
        time: "16:00"
        day_times:
          fri: "15:00"
        shorts_times: ["10:00", "14:00", "16:00", "18:00"]

# Facebook caption A/B (docs/pipeline/136-brand-policy.md). Arms are assigned
# at generation and tagged in the publish-plan sidecar; `metrics collect`
# prints one `EXPERIMENT fb_hashtags ...` line per arm.
policy:
  # One Short per drive, its best clip (planner only; doc 136).
  shorts_per_drive: 1
  experiments:
    - name: fb_hashtags
      platforms: [facebook]
      start: 2026-11-02
      stop_after_days: 45
      min_n: 20
      arms:
        A: {hashtag_mode: none}
        B: {hashtag_mode: location}
        C: {hashtag_mode: june}
  # Licensed music on half the Facebook and Instagram Shorts (JP 2026-11-26:
  # "You can test music on Facebook and Instagram Shorts"). Shorts stay muted;
  # a ledger-licensed track is added at upload only (doc 188). Inert until a
  # track and its ledger entry are in the private music folder.
  shorts_music:
    start: 2026-11-27
    stop_after_days: 45
    platforms: [facebook, instagram]
