# One job on a standard hosted runner. No secrets, no self-hosted runner, no
# matrix: a pull request from a fork runs exactly what a maintainer's does.
# GPU checks are not run here; see docs/gpu-checks.md.
# Only the "Set up" step downloads anything. Every check after it runs with the
# package index switched off, so a check cannot pass or fail on what it fetched.
name: ci

# A pull request run covers the PR head; the push run covers the merge result
# on main. Different commits, so no commit runs twice.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. Runs on
# main are keyed by commit, so one never cancels another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # System Python, isolated mode, before anything is installed.
      - name: Tree cleanliness (committed tree)
        run: |
          python3 -I tools/check_public_tree.py
          python3 -I tools/tests/test_check_public_tree.py
          python3 -I tools/tests/test_check_cleanliness_ci.py

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache downloaded packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'requirements.lock', 'ci/tools-requirements.txt', 'ci/siblings.txt') }}

      # A pinned, checksummed ffmpeg 8.1 static build, not apt's 6.1: the blur
      # composite's empty-mask no-op is pixel-exact on 8.x and not on 6.1, so
      # 8.1 is the supported floor (docs/install.md).
      - name: Install ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79  # pragma: allowlist secret (public ffmpeg build checksum, not a credential)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version | head -1

      - name: Set up tools and the project
        run: |
          python3 -m pip install --quiet uv==0.11.17
          uv venv "$RUNNER_TEMP/ci-tools" --python python3 -q
          uv pip install --python "$RUNNER_TEMP/ci-tools/bin/python" -q -r ci/tools-requirements.txt
          bash ci/install-cpu.sh
          uv pip install --python .venv/bin/python -q mypy==2.3.0

      - name: Secret scan
        env:
          UV_OFFLINE: "1"
          PIP_NO_INDEX: "1"
        run: |
          export DETECT_SECRETS="$RUNNER_TEMP/ci-tools/bin/detect-secrets"
          python3 ci/tests/test_secret_scan.py
          python3 ci/secret_scan.py

      - name: Lint and format
        env:
          UV_OFFLINE: "1"
          PIP_NO_INDEX: "1"
        run: |
          "$RUNNER_TEMP/ci-tools/bin/ruff" check . --output-format=github
          "$RUNNER_TEMP/ci-tools/bin/ruff" format . --check

      # pyproject.toml excludes gomoveshift/, tests/ and scripts/ from mypy, so
      # this step covers only the scripts and CI helpers.
      - name: Type check (tools, ci and bin only)
        env:
          UV_OFFLINE: "1"
          PIP_NO_INDEX: "1"
        run: .venv/bin/python -m mypy . --config-file pyproject.toml

      - name: Tests
        env:
          UV_OFFLINE: "1"
          PIP_NO_INDEX: "1"
        run: .venv/bin/pytest

      # Runs after a failed build too: a build or test that writes into the
      # tree, or leaves anything behind that is not a known cache, fails here.
      - name: Tree cleanliness (after build and tests)
        if: always()
        run: python3 -I tools/check_public_tree.py --check-clean

  # The one job that needs the network after setup: it asks the vulnerability
  # databases about the versions pinned in requirements.lock. Coverage is those
  # pins only: direct dependencies with no lock pin (git references, the GPU
  # runtime) are not scanned. Advisory: continue-on-error sits on the audit step,
  # so the job still ends green while advisories are open, and the report is in
  # the step summary. Once the pins are clean, drop that line so a new advisory
  # fails the build. Entries in .pip-audit-ignore are passed through.
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pip-audit
        run: |
          python3 -m pip install --quiet uv==0.11.17
          uv venv "$RUNNER_TEMP/audit" --python python3 -q
          uv pip install --python "$RUNNER_TEMP/audit/bin/python" -q -r ci/audit-requirements.txt

      - name: Audit locked versions
        continue-on-error: true
        run: |
          ignore=()
          while read -r id; do
            ignore+=(--ignore-vuln "$id")
          done < <(grep -E '^(PYSEC|GHSA|CVE)-[0-9A-Za-z-]+$' .pip-audit-ignore || true)
          grep -v '^-e ' requirements.lock > "$RUNNER_TEMP/audit-requirements.txt"
          rc=0
          "$RUNNER_TEMP/audit/bin/pip-audit" --no-deps --disable-pip \
            -r "$RUNNER_TEMP/audit-requirements.txt" "${ignore[@]}" \
            > "$RUNNER_TEMP/audit-report.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/audit-report.txt"
          if [ "$rc" -ne 0 ]; then
            {
              echo "### pip-audit (advisory)"
              echo '```'
              cat "$RUNNER_TEMP/audit-report.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::pip-audit found advisories in the locked versions (advisory step)"
          fi
          exit "$rc"
